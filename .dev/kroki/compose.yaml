# Local Kroki for rendering mermaid/plantuml diagrams in the VSCode AsciiDoc preview.
# Runs on the podman engine of bioskop-nixos (docker context "nerd-nixos").
# The core service delegates mermaid rendering to the companion container.
#
# Why local: the public kroki.io only SERVES diagrams it already has cached and
# cannot do a fresh render from this network, so any NEW/edited diagram showed an
# empty frame. A local kroki renders fresh content reliably.
#
# Start:   docker --context nerd-nixos compose -f .dev/kroki/compose.yaml up -d
# URL:     http://100.64.0.15:8000   (bioskop-nixos tailscale IP; wired into .vscode/settings.json)
services:
  kroki:
    image: yuzutech/kroki:latest
    restart: unless-stopped
    depends_on:
      - mermaid
    environment:
      KROKI_MERMAID_HOST: mermaid
      KROKI_MERMAID_PORT: "8002"
      JAVA_OPTS: "-Dlog.level=DEBUG"
    ports:
      - "8000:8000"
  mermaid:
    image: yuzutech/kroki-mermaid:latest
    restart: unless-stopped
    expose:
      - "8002"
