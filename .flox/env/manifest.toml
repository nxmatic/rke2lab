schema-version = "1.10.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
pulumi.pkg-path = "pulumi-bin"
pulumictl.pkg-path = "pulumictl"
distrobuilder.pkg-path = "distrobuilder"
distrobuilder.systems = ["aarch64-linux"]
cdk8s-cli.pkg-path = "cdk8s-cli"
dasel.pkg-path = "dasel"
dasel.version = "3.3.0"
graphviz.pkg-path = "graphviz"
## incus client. Full `incus` daemon is Linux-only in nixpkgs/flox catalog,
## but its client sub-binary builds on both platforms via the
## `pkgs.incus.passthru.client` derivation, surfaced as `.#incus-client`
## from the top-level flake. Single source for both Darwin shells (where
## we run `incus exec master`) and the Linux NixOS VM.
##
## Reference the github repo (not `path:.`) so the lock pins to a commit
## SHA portable across machines. `path:.` would bake the dev-machine
## absolute path into manifest.lock and break flox activate on the NixOS
## image-builder host (which only sees the repo via NFS at a different
## absolute path). Bumping: `flox upgrade` or `flox update` picks up
## new commits on main.
incus-client.flake = "github:nxmatic/rke2lab#incus-client"

## Maven-build toolchain consumed from the rke2lab flake, which is the single
## source of truth (see `mavenToolchain` / `devShells.default` in flake.nix).
## Pinned here so the dev loop is deterministic and identical to the nix store
## build: same jdk25, shfmt, shellcheck versions. (Maven itself comes from the
## `./mvnw` wrapper, so it is not pinned here.) These top-level entries take
## precedence over the unpinned `pkg-path` copies the fleet `flox/jdk` and
## `flox/shell` includes would otherwise supply, and keep the dev loop's shfmt
## matched to the Maven spotless gate (`<shfmt.version>` in pom.xml). Same
## `github:` (not `path:.`) rationale as incus-client above; bump with
## `flox upgrade` after pushing flake changes.
jdk25.flake = "github:nxmatic/rke2lab#jdk25"
shfmt.flake = "github:nxmatic/rke2lab#shfmt"
shellcheck.flake = "github:nxmatic/rke2lab#shellcheck"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
  PULUMI_CONFIG_PASSPHRASE=''
  PULUMI_HOME='${XDG_STATE_HOME:-$HOME/.local/state}/pulumi'
  PULUMI_BACKEND_URL='file://${FLOX_ENV_PROJECT}/.pulumi-state'
  GITHUB_OWNER='nxmatic'

# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
  mkdir -p "${PULUMI_HOME}"
  mkdir -p "${FLOX_ENV_PROJECT}/.pulumi-state"
  if command -v javac >/dev/null 2>&1; then
    export JAVA_HOME="$(dirname "$(dirname "$(command -v javac)")")"
  fi
  if command -v gh >/dev/null 2>&1 && [ -z "${GH_TOKEN:-}" ]; then
    GH_TOKEN="$(gh auth token 2>/dev/null)" && export GH_TOKEN
  fi
  # Activate the repo-tracked git hooks (.githooks/) so the wip/-on-main guard travels with
  # every clone — .git/hooks/ is local-only and would not be shared. Idempotent.
  if [ -d "${FLOX_ENV_PROJECT}/.githooks" ] && command -v git >/dev/null 2>&1; then
    if [ "$(git -C "${FLOX_ENV_PROJECT}" config core.hooksPath 2>/dev/null)" != ".githooks" ]; then
      git -C "${FLOX_ENV_PROJECT}" config core.hooksPath .githooks
    fi
  fi
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
  environments = [
    { dir = "../fleet/flox/git" },
    ## Removed fleet/jdk - we install jdk25 from flake directly above
    { dir = "../fleet/flox/k8s" },
    { dir = "../fleet/flox/keyhole" },
    { dir = "../fleet/flox/pulumi" },
    { dir = "../fleet/flox/shell" },
  ]


