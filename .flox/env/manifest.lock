      "hook": {
        "on-activate": "  mkdir -p \"${PULUMI_HOME}\"\n  mkdir -p \"${FLOX_ENV_PROJECT}/.pulumi-state\"\n  if command -v javac >/dev/null 2>&1; then\n    export JAVA_HOME=\"$(dirname \"$(dirname \"$(command -v javac)\")\")\"\n  fi\n  if command -v gh >/dev/null 2>&1 && [ -z \"${GH_TOKEN:-}\" ]; then\n    GH_TOKEN=\"$(gh auth token 2>/dev/null)\" && export GH_TOKEN\n  fi\n"
      },
      "profile": {
        "common": "    GITHUB_SIGNING_KEYFILE=\"$HOME\"/.ssh/keys.d/github-signing\n    if [[ -r \"$GITHUB_SIGNING_KEYFILE\" ]]; then\n      set -a\n      SOPS_AGE_KEY=$( ssh-to-age -private-key < \"$GITHUB_SIGNING_KEYFILE\" )\n      RKE2LAB_CELLAR_RECIPIENTS=$( ssh-to-age < \"$GITHUB_SIGNING_KEYFILE\".pub )\n      set +a\n    else\n      echo no signing key\n    fi\n  "
