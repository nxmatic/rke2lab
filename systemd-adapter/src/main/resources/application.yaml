# @codebase
server:
  port: ${RK2LAB_SYSTEMD_ADAPTER_PORT:18080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

rk2lab:
  systemd:
    adapter:
      mandatory-target: ${RK2LAB_SYSTEMD_MANDATORY_TARGET:rke2lab.target}
      command-timeout-seconds: ${RK2LAB_SYSTEMD_COMMAND_TIMEOUT_SECONDS:5}
