## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##               https://flox.dev/docs/concepts/manifest
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
schema-version = "1.10.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]

  [install.kubectl]
  pkg-path = "kubectl"
outputs = "all"

  [install.yq-go]
  pkg-path = "yq-go"

  [install.bash]
  pkg-path = "bash"
outputs = "all"

  [install.coreutils]
  pkg-path = "coreutils"
outputs = "all"

  # Workload packages live in the parent runtime flake (runtime/flox/flake.nix).
  # Reference it via a path relative to this env dir so we don't depend on the
  # host's `/var/run -> /run` symlink (nix's path-flake fetcher canonicalizes
  # through realpath and trips on the symlink hop). The env dir is
  # runtime/flox/environment.d/mesh/headplane/, so ../../.. = runtime/flox/.

  [install.headplane]
  flake = "path:../../..#headplane"

  [install.headscale]
  flake = "path:../../..#headscale"

  [install.headplane-agent]
  flake = "path:../../..#headplane-agent"

  [install.headplane-ssh-wasm]
  flake = "path:../../..#headplane-ssh-wasm"

## Other Environment Options -----------------------------------------
# This env activates inside Linux containers on the cluster nodes — restrict
# resolution to Linux so darwin-incompatible packages don't block flox
# lock/activate.
[options]
systems = ["aarch64-linux"]
