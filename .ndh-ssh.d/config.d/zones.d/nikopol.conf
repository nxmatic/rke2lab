# slacoin@nuxeo.com gnupg keyring (https://github.com/nxmatic/keyhole.git)

Host rdp.nikopol
   HostName nikopol.local

# `vz.nikopol` (the bare-metal Mac hosting this Tart VM) is defined
# in two places, NOT here, because the resolution mechanism differs
# by host:
#   - On the nikopol VM itself: matchBlock in
#     hosts/nikopol/modules/darwin/vz-host-resolver.nix → ProxyCommand
#     uses an ARP-cache lookup of the bare metal's stable hardware MAC.
#   - On bioskop / any other operator host: rendered into the global
#     ssh-tailnet-hosts extraConfig as a `ProxyJump nikopol` block,
#     gated on `currentHostName != "nikopol"`.  See
#     modules/home-manager/ssh-tailnet-hosts.nix vzAliasForBioskopSide.

# Wildcard nikopol service-prefix defaults.  Excludes `vz.nikopol`
# because that alias targets a different account (`stephane.lacoin`
# on the corp bare metal) — its block is in vz-host-resolver.nix
# (on the nikopol VM) and ssh-tailnet-hosts.nix (on bioskop).
# Without the negation, this `*.nikopol` block would set
# `User nxmatic` for vz.nikopol because Include files are read
# before inline matchBlocks and SSH's first-match-wins applies.
Host *.nikopol !vz.nikopol
   User nxmatic
   IdentityFile ~/.local/var/run/secrets/ssh-keys/rdp-host

Host nixos.nikopol
   HostName nikopol-nixos.local
   
Include ~/.ssh/config.d/zones.d/nikopol.d/*.conf
