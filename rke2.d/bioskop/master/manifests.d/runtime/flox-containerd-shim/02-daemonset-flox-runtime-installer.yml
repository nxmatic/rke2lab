---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    internal.kpt.dev/upstream-identifier: apps|DaemonSet|flox-runtime|flox-runtime-installer
    kpt.dev/package-layer: runtime
    kpt.dev/package-name: flox-containerd-shim
  labels:
    app.kubernetes.io/component: runtime-shim
    app.kubernetes.io/name: flox-runtime-installer
  name: flox-runtime-installer
  namespace: flox-runtime
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flox-runtime-installer
  template:
    metadata:
      annotations:
        kpt.dev/package-layer: runtime
        kpt.dev/package-name: flox-containerd-shim
      labels:
        app.kubernetes.io/component: runtime-shim
        app.kubernetes.io/name: flox-runtime-installer
    spec:
      automountServiceAccountToken: false
      containers:
        - image: registry.k8s.io/pause:3.10
          name: pause
          resources:
            limits:
              cpu: 10m
              ephemeral-storage: 64Mi
              memory: 64Mi
            requests:
              cpu: 5m
              ephemeral-storage: 32Mi
              memory: 32Mi
      hostPID: true
      initContainers:
        - command:
            - /bin/sh
            - -c
            - |
              # Use nsenter to run the build script in the host's environment
              # This gives access to host's flox, nix, yq, and environment
              if [ ! -f /config/flox-builds.yaml ]; then
                echo "No flox-builds.yaml found, skipping Nix builds"
                exit 0
              fi
              # Copy ConfigMap from container to host via pipe (can't access container fs from nsenter)
              cat /config/flox-builds.yaml | nsenter --target 1 --mount --uts --ipc --net --pid -- \
                sh -c 'cat > /tmp/flox-builds.yaml'
              # Run the build script in host context
              nsenter --target 1 --mount --uts --ipc --net --pid -- \
                /srv/host/scripts.d/rke2lab-flox-build.sh /tmp/flox-builds.yaml
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          name: flox-builder
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /config
              name: flox-builds-config
              readOnly: true
        - command:
            - /scripts/shim-installer.sh
          env:
            - name: CONTAINERD_CONFIG_FILE
              value: /var/lib/rancher/rke2/agent/etc/containerd/config.toml
            - name: CONTAINERD_ADDRESS
              value: /run/k3s/containerd/containerd.sock
            - name: APK_MAX_RETRIES
              value: "5"
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          name: shim-installer
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /scripts
              name: runtime-installer-script
              readOnly: true
      nodeSelector:
        flox.dev/enabled: "true"
      restartPolicy: Always
      serviceAccountName: flox-runtime-installer
      tolerations:
        - operator: Exists
      volumes:
        - configMap:
            name: flox-builds-config
          name: flox-builds-config
        - configMap:
            defaultMode: 493
            name: flox-runtime-installer-script
          name: runtime-installer-script
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
