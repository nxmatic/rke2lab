---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flox-builds-config
  namespace: flox-runtime
data:
  flox-builds.yaml: |
    version: "1"
    # Nix build jobs that run during RKE2 initialization
    # Each job builds packages from a flake and makes them available to Kubernetes pods

    jobs:
      # Mesh packages (headplane + headscale)
      - name: mesh
        description: "Build mesh packages (headplane + headscale) from flake"
        enabled: true
        flakePath: catalog/mesh/headplane
        outputDir: /tmp/mesh-build
        logFile: /var/log/rke2-mesh-build.log
        packages:
          - name: headplane
            attr: "packages.aarch64-linux.headplane"
          - name: headplane-agent
            attr: "packages.aarch64-linux.headplane-agent"
          - name: headscale
            attr: "packages.aarch64-linux.headscale"

    # To add more Nix build jobs, follow the format:
    # - name: mypackage
    #   description: "Build mypackage from custom flake"
    #   enabled: true
    #   flakePath: /srv/host/catalog/path/to/flake
    #   outputDir: /tmp/mypackage-build
    #   logFile: /var/log/rke2-mypackage-build.log
    #   packages:
    #     - name: mypackage
    #       attr: "packages.aarch64-linux.mypackage"
