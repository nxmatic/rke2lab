---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    internal.kpt.dev/upstream-identifier: apps|Deployment|${headscale-namespace}|headplane
    kpt.dev/package-layer: mesh
    kpt.dev/package-name: headplane
  labels:
    app: headplane
  name: headplane
  namespace: headscale-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headplane
  template:
    metadata:
      annotations:
        flox.dev/environment: nxmatic/headplane
        kpt.dev/package-layer: mesh
        kpt.dev/package-name: headplane
      labels:
        app: headplane
    spec:
      containers:
        - args:
            - serve
          command:
            - headplane
          env:
            - name: HEADPLANE_LOAD_ENV_OVERRIDES
              value: "true"
            - name: HEADPLANE_INTEGRATION__KUBERNETES__POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: headplane-env
            - configMapRef:
                name: flox-env
          image: flox/empty:1.0.0
          livenessProbe:
            exec:
              command:
                - /usr/libexec/headplane/healthcheck
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: headplane
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            exec:
              command:
                - /usr/libexec/headplane/healthcheck
            failureThreshold: 2
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 512Mi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 256Mi
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/headplane/config.yaml
              name: config
              subPath: config.yaml
            - mountPath: /etc/headplane/secrets
              name: secrets
              readOnly: true
            - mountPath: /etc/headplane/agent
              name: agent
              readOnly: true
            - mountPath: /var/lib/headplane
              name: data
            - mountPath: /etc/headscale
              name: headscale-config
              readOnly: true
            - mountPath: /usr/libexec/headplane
              name: shared-bin
      initContainers:
        - command:
            - sh
            - -c
            - |
              mkdir -p /usr/libexec/headplane
              ln -sf /.flox/run/aarch64-linux.headplane.run/bin/hp_agent /usr/libexec/headplane/agent
              ln -sf /.flox/run/aarch64-linux.headplane.run/bin/hp_healthcheck /usr/libexec/headplane/healthcheck
              chmod +x /usr/libexec/headplane/agent /usr/libexec/headplane/healthcheck
          image: flox/empty:1.0.0
          name: setup-agent
          volumeMounts:
            - mountPath: /usr/libexec/headplane
              name: shared-bin
      runtimeClassName: flox
      serviceAccountName: headplane
      shareProcessNamespace: true
      volumes:
        - name: config
          secret:
            secretName: headplane-config
        - name: secrets
          secret:
            secretName: headplane-secrets
        - name: agent
          secret:
            secretName: headplane-agent-auth
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
        - configMap:
            name: headscale-config
          name: headscale-config
        - emptyDir: {}
          name: shared-bin
