apiVersion: apps/v1
kind: Deployment
metadata: # kpt-merge: ${headscale-namespace}/headplane
  name: headplane
  namespace: ${headscale-namespace} # kpt-set: ${headscale-namespace}
  labels:
    app: headplane
  annotations:
    internal.kpt.dev/upstream-identifier: 'apps|Deployment|${headscale-namespace}|headplane'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headplane
  template:
    metadata:
      labels:
        app: headplane
      annotations:
        flox.dev/environment: "${headplane-flox-env}" # kpt-set: ${headplane-flox-env}
    spec:
      shareProcessNamespace: true
      runtimeClassName: flox
      serviceAccountName: headplane
      initContainers:
        - name: setup-agent
          image: flox/empty:1.0.0
          command:
            - sh
            - -c
            - |
              mkdir -p /usr/libexec/headplane
              ln -sf /.flox/run/aarch64-linux.headplane.run/bin/hp_agent /usr/libexec/headplane/agent
              ln -sf /.flox/run/aarch64-linux.headplane.run/bin/hp_healthcheck /usr/libexec/headplane/healthcheck
          volumeMounts:
            - name: shared-bin
              mountPath: /usr/libexec/headplane
      containers:
        - name: headplane
          image: flox/empty:1.0.0
          command: ["headplane"]
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: headplane-env
            - configMapRef:
                name: flox-env
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HEADPLANE_LOAD_ENV_OVERRIDES
              value: "true"
            - name: HEADPLANE_INTEGRATION__KUBERNETES__POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /etc/headplane/config.yaml
              subPath: config.yaml
            - name: secrets
              mountPath: /etc/headplane/secrets
              readOnly: true
            - name: agent
              mountPath: /etc/headplane/agent
              readOnly: true
            - name: data
              mountPath: /var/lib/headplane
            - name: headscale-config
              mountPath: /etc/headscale
              readOnly: true
            - name: shared-bin
              mountPath: /usr/libexec/headplane
          livenessProbe:
            exec:
              command:
                - /usr/libexec/headplane/healthcheck
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/libexec/headplane/healthcheck
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: config
          secret:
            secretName: headplane-config
        - name: secrets
          secret:
            secretName: headplane-secrets
        - name: agent
          secret:
            secretName: headplane-agent-auth
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
        - name: headscale-config
          configMap:
            name: headscale-config
        - name: shared-bin
          emptyDir: {}
