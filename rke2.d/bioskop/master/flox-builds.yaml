version: "1"
# Nix build jobs that run during RKE2 initialization
# Each job builds packages from a flake and makes them available to Kubernetes pods
#
# Path Resolution:
#   - Relative paths: resolved relative to rke2.d/{CLUSTER}/{NODE}/ directory
#     Example: "catalog/mesh/headplane" resolves to
#     /srv/host/git/nxmatic/rke2lab/rke2.d/bioskop/master/catalog/mesh/headplane
#
#   - Absolute paths: used as-is if they exist
#     Example: /srv/host/catalog/mesh/headplane (from another git tree)
#
# Environment Variables (set automatically):
#   - RKE2LAB_CLUSTER_NAME: bioskop
#   - RKE2LAB_NODE_NAME: master
#   - RKE2LAB_ROOT: /srv/host
#   - Git workdir mounted at: /srv/host/git/nxmatic/rke2lab

jobs:
  # Mesh packages (headplane + headscale)
  - name: mesh
    description: "Build mesh packages (headplane + headscale) from flake"
    enabled: true
    flakePath: catalog/mesh/headplane
    outputDir: /tmp/mesh-build
    logFile: /var/log/rke2-mesh-build.log
    packages:
      - name: headplane
        attr: "packages.aarch64-linux.headplane"
      - name: headplane-agent
        attr: "packages.aarch64-linux.headplane-agent"
      - name: headscale
        attr: "packages.aarch64-linux.headscale"

  # Networking packages (kdns)
  - name: networking
    description: "Build networking packages (kdns) from flake"
    enabled: true
    flakePath: catalog/networking/kdns
    outputDir: /tmp/networking-build
    logFile: /var/log/rke2-networking-build.log
    packages:
      - name: kdns
        attr: "packages.aarch64-linux.kdns"

# To add more Nix build jobs, follow the format:
# - name: mypackage
#   description: "Build mypackage from custom flake"
#   enabled: true
#   # Relative paths: resolved relative to rke2.d/{CLUSTER}/{NODE}/
#   flakePath: catalog/path/to/flake
#   # Absolute paths: used as-is
#   # flakePath: /srv/host/git/nxmatic/rke2lab/rke2.d/bioskop/master/catalog/path/to/flake
#   outputDir: /tmp/mypackage-build
#   logFile: /var/log/rke2-mypackage-build.log
#   packages:
#     - name: mypackage
#       attr: "packages.aarch64-linux.mypackage"
