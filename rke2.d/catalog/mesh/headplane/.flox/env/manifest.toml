## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##               https://flox.dev/docs/concepts/manifest
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
version = 1


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]

  [install.kubectl]
  pkg-path = "kubectl"

  [install.bash]
  pkg-path = "bash"

  [install.coreutils]
  pkg-path = "coreutils"

  [install.headplane]
  store-path = "/nix/store/15ng86jmka6lff9615dyww141jj06wn9-headplane-0.6.1"

  [install.headscale]
  store-path = "/nix/store/dbcnax93bqfjxwjl7jz3yvam3v3bwpz3-headscale-0.27.1"

  [install.headplane-agent]
  store-path = "/nix/store/rc1wq6a2qjsdxjg7qymcran24528fxyc-hp_agent-0.6.1"

  [install.headplane-ssh-wasn]
  store-path = "/nix/store/rvkhn2k1y1ckarzbgz9pnwbrlmp58dgk-headplane-ssh-wasm-0.6.1"

## Other Environment Options -----------------------------------------
[options]
# Systems that environment is compatible with
systems = [
  "aarch64-linux",
  "aarch64-darwin",
]
