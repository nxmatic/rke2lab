apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-bootstrap-script
  namespace: ${headscale-namespace} # kpt-set: ${headscale-namespace}
  labels:
    app: headplane
data:
  bootstrap.sh: |
    #!/usr/bin/env -S bash -exuo pipefail

    : "Waiting for headscale deployment to be available..."
    kubectl wait --for=condition=available deployment/headscale \
      -n "$HEADSCALE_NAMESPACE" --timeout=300s

    : "Waiting for headscale pod to be Ready..."
    kubectl wait --for=condition=Ready pod -l app=headscale \
      -n "$HEADSCALE_NAMESPACE" --timeout=300s

    : "Creating Headplane API key..."
    API_KEY=$( kubectl exec -n "$HEADSCALE_NAMESPACE" deployment/headscale -- \
      headscale apikeys create -o yaml |
      yq -r '.key' - )
    if [ -z "$API_KEY" ]; then
      echo "ERROR: Failed to create API key"
      exit 1
    fi

    : "Updating headplane-secrets with API key..."
    kubectl patch secret headplane-secrets \
      -n "$HEADSCALE_NAMESPACE" \
      --type merge \
      -p "{\"stringData\":{\"api_key\":\"$API_KEY\"}}"

    echo "✓ Headplane API key created and stored in secret"
