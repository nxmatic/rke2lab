---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: mesh
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: funnel-cert-restore
  name: funnel-cert-restore
  namespace: mesh-system
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        flox.seedmatic.io/environment.mirror: kube/base
    spec:
      containers:
      - command:
        - flox
        - activate
        - --dir
        - /root
        - --
        - bash
        - -c
        - |
          set -euo pipefail
          if [ -s /persist/state.yaml ]; then
            echo "restoring saved tailscale funnel state into ts-pipelines-webhook-state"
            kubectl apply -n mesh-system -f /persist/state.yaml
          else
            echo "no saved funnel state on the persist volume — clean first grow"
          fi
        image: rke2lab/flox-carrier:0.1.0
        name: mirror
        volumeMounts:
        - mountPath: /persist
          name: persist
      restartPolicy: OnFailure
      serviceAccountName: funnel-cert-restore
      volumes:
      - name: persist
        persistentVolumeClaim:
          claimName: pipelines-webhook-funnel-cert
