---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    io.seedmatic.rke2lab/domain: mesh
    io.seedmatic.rke2lab/layer: operators
    io.seedmatic.rke2lab/package: tailnet-purge
  name: tailnet-purge
  namespace: mesh-system
spec:
  backoffLimit: 20
  template:
    metadata:
      annotations:
        flox.seedmatic.io/environment.purge: mesh/tailnet
    spec:
      containers:
      - command:
        - flox
        - activate
        - --dir
        - /root
        - --
        - bash
        - -c
        - |
          set -uo pipefail
          guard=90
          deadline=$(( $(date +%s) + guard ))
          echo "tailnet stale-device prune — stop when clean, ${guard}s guard cap"
          while true; do
            pruned="$(manage-tailnet --prune-stale-devices --stale-after 1s --yes     --client-secret-file /etc/tailnet/client-secret --format=json     | yq -p=json 'select(.event == "pruned") | .host' || true)"
            if [ -z "$pruned" ]; then
              echo "no stale devices left to prune — tailnet clean; safe to deploy"
              exit 0
            fi
            echo "pruned: $(echo "$pruned" | tr '\n' ' ')"
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "guard window elapsed while still pruning — proceeding anyway (safe)"
              exit 0
            fi
            sleep 5
          done
        image: rke2lab/flox-carrier:0.1.0
        name: purge
        volumeMounts:
        - mountPath: /etc/tailnet
          name: oauth
          readOnly: true
      restartPolicy: OnFailure
      serviceAccountName: tailnet-purge
      volumes:
      - name: oauth
        secret:
          items:
          - key: client_secret
            path: client-secret
          secretName: tailnet-purge-oauth
