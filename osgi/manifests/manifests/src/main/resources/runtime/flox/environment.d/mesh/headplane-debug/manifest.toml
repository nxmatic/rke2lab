# Headplane debug environment: ships headplane-debug (sourcemaps preserved,
# entrypoint runs `node --enable-source-maps --inspect=0.0.0.0:9229`) alongside
# an interactive shell so the user can attach a Node.js inspector to the
# running pod. Mounted by the flox NRI plugin under
# `flox.dev/environment.<container-name>` = "mesh/headplane-debug" via the
# `<workload>-shell` sidecar in the headplane Deployment.
schema-version = "1.10.0"

[install]

  [install.bash]
  pkg-path = "bash"
  outputs = "all"

  [install.coreutils]
  pkg-path = "coreutils"
  outputs = "all"

  [install.kubectl]
  pkg-path = "kubectl"
  outputs = "all"

  [install.yq-go]
  pkg-path = "yq-go"

  [install.strace]
  pkg-path = "strace"

  [install.curl]
  pkg-path = "curl"

  [install.headplane-debug]
  flake = "path:../../..#headplane-debug"

  [install.headplane-agent]
  flake = "path:../../..#headplane-agent"

  [install.headplane-ssh-wasm]
  flake = "path:../../..#headplane-ssh-wasm"

[options]
systems = ["aarch64-linux"]
