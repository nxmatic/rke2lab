# Tailscale prod environment: ships the upstream tailscale + tailscaled
# binaries used by the headscale-gateway Deployment and the headscale-client
# DaemonSet. Mounted by the flox NRI plugin under
# `flox.dev/environment.<container-name>` = "mesh/tailscale".
schema-version = "1.10.0"

[install]

  [install.bash]
  pkg-path = "bash"
  outputs = "all"

  [install.coreutils]
  pkg-path = "coreutils"
  outputs = "all"

  [install.tailscale]
  flake = "path:../../..#tailscale"

[options]
systems = ["aarch64-linux"]
