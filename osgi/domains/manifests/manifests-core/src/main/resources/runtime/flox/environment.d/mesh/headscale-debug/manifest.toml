# Headscale debug environment: ships `headscale-debug` (unstripped + -N -l,
# delve wrapped onto the binary's PATH) plus delve and interactive shell
# tools. Mounted by the flox NRI plugin into the prod container when
# `policy.debug.nriPlugins.flox.enabled=true`, so the shell sidecar can
# `dlv attach $(pgrep headscale)` through the shared PID namespace and step
# through the live workload with full source-level visibility. The debug
# package replaces (not augments) the prod headscale binary in PATH while
# this env is active.
schema-version = "1.10.0"

[install]

  [install.bash]
  pkg-path = "bash"
  outputs = "all"

  [install.coreutils]
  pkg-path = "coreutils"
  outputs = "all"

  [install.delve]
  pkg-path = "delve"

  [install.strace]
  pkg-path = "strace"

  [install.curl]
  pkg-path = "curl"

  [install.headscale-debug]
  flake = "path:../../..#headscale-debug"

[options]
systems = ["aarch64-linux"]
