name: rke2lab
runtime:
  name: java
  options:
    # Store-built bootstrap jar via `nix build .#seed-master` (-> ./result).
    # The artifact Pulumi runs is the immutable store path, not a mutable
    # target/ build. Run `nix build .#seed-master` before `pulumi up`.
    binary: result/share/java/seed-master.jar
description: Pulumi-based provisioning control plane for RK2Lab management cluster bootstrap
packages:
  incus:
    source: pulumi/pulumi/terraform-provider
    version: 1.1.1
    parameters:
      - lxc/incus
