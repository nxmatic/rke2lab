[Service]
# rke2-agent does NOT generate the cluster kubeconfig; the master writes it via its own
# rke2-server.service.d/kubeconfig.conf and all nodes share the cluster-scoped bind mount at
# /srv/host/rke2lab-kube.d/kubeconfig.yaml.
ExecStartPost=/bin/sh -xc '/srv/host/systemd-scripts.d/rke2lab-tools-configuration-directories.sh'
