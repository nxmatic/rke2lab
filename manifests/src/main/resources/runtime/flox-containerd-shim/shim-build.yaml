version: "1"
# Flox shim package build jobs that run during RKE2 initialization.
#
# flakePath values are resolved relative to this descriptor location.
# Flakes are provided under ./<domain>/<name>/

jobs:
  - name: runtime
    description: "Build containerd shim flox wrapper package from packaged flake"
    enabled: true
    flakePath: "."
    outputDir: /tmp/runtime-shim-build
    logFile: /var/log/rke2-runtime-shim-build.log
    packages:
      - name: go-wrapper

  - name: mesh
    description: "Build mesh packages (headplane + headscale) from packaged flake"
    enabled: true
    flakePath: "mesh/headplane"
    outputDir: /tmp/mesh-build
    logFile: /var/log/rke2-mesh-build.log
    packages:
      - name: headplane
      - name: headplane-agent
      - name: headscale

  - name: networking
    description: "Build networking packages (kdns) from packaged flake"
    enabled: true
    flakePath: "networking/kdns"
    outputDir: /tmp/networking-build
    logFile: /var/log/rke2-networking-build.log
    packages:
      - name: kdns
