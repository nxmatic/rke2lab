# Headscale prod environment: ships the headscale control-server binary
# alongside the minimal carrier shell expected by the flox NRI overlay path.
# Mounted by the flox NRI plugin under `flox.dev/environment.<container-name>`
# = "mesh/headscale".
schema-version = "1.10.0"

[install]

  [install.bash]
  pkg-path = "bash"
  outputs = "all"

  [install.coreutils]
  pkg-path = "coreutils"
  outputs = "all"

  [install.headscale]
  # Workload package lives in the parent runtime flake (runtime/flox/flake.nix).
  # Path is relative to this env dir to avoid the `/var/run -> /run` symlink
  # hop that trips nix's path-flake fetcher. Env dir is
  # runtime/flox/environment.d/mesh/headscale/, so ../../.. = runtime/flox/.
  flake = "path:../../..#headscale"

[options]
systems = ["aarch64-linux"]
