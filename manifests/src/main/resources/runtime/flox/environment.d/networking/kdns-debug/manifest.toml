# kdns debug environment: ships kdns-debug (delve-wrapped, no-strip, no-inline)
# alongside an interactive shell so the user can attach a debugger or poke
# around the running container. Mounted by the flox NRI plugin under
# `flox.dev/environment.<container-name>` = "networking/kdns-debug".
schema-version = "1.10.0"

[install]

  [install.go]
    pkg-path = "go"
    version = "^1.25"

  [install.delve]
    pkg-path = "delve"

  [install.bash]
    pkg-path = "bash"
    outputs = "all"

  [install.coreutils]
    pkg-path = "coreutils"
    outputs = "all"

  # busybox dropped — its bin/sh conflicts with bash's, and we want
  # bash (with completion + line editing) for an interactive debug shell.

  [install.strace]
    pkg-path = "strace"

  [install.curl]
    pkg-path = "curl"

  [install.kdns-debug]
    # Workload package now lives in the parent runtime flake (see runtime/flox/flake.nix).
    # The host materializer bind-mounts that flake at this absolute path on every guest.
    flake = "path:/var/run/k8s-daemonset.d/runtime/flox#kdns-debug"

[vars]

[hook]

[profile]

[services]

[include]

[build]

# These envs activate inside Linux containers on the cluster nodes — restrict
# resolution to Linux so darwin-incompatible packages (busybox, strace) don't
# block flox lock/activate.
[options]
systems = ["aarch64-linux"]
