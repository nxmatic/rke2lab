## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##               https://flox.dev/docs/concepts/manifest
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
schema-version = "1.10.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]

  [install.kubectl]
  pkg-path = "kubectl"
outputs = "all"

  [install.yq-go]
  pkg-path = "yq-go"

  [install.bash]
  pkg-path = "bash"
outputs = "all"

  [install.coreutils]
  pkg-path = "coreutils"
outputs = "all"

  # Workload packages now live in the parent runtime flake
  # (runtime/flox-runtime/flake.nix). The host materializer bind-mounts that
  # flake at this absolute path on every guest.

  [install.headplane]
  flake = "path:/srv/host/k8s-daemonset.d/runtime/flox-runtime#headplane"

  [install.headscale]
  flake = "path:/srv/host/k8s-daemonset.d/runtime/flox-runtime#headscale"

  [install.headplane-agent]
  flake = "path:/srv/host/k8s-daemonset.d/runtime/flox-runtime#headplane-agent"

  [install.headplane-ssh-wasm]
  flake = "path:/srv/host/k8s-daemonset.d/runtime/flox-runtime#headplane-ssh-wasm"

## Other Environment Options -----------------------------------------
[options]
systems = ["aarch64-linux", "aarch64-darwin"]
