# slacoin@nuxeo.com gnupg keyring (https://github.com/nxmatic/keyhole.git)

Host rdp.nikopol
   HostName nikopol

# `vzhost.nikopol` (the bare-metal Mac hosting this Tart VM) is NOT defined
# here — its single stanza lives in modules/home-manager/ssh-tailnet-hosts.nix,
# rendered uniformly on every managed host.  Resolution + reachability ride
# the per-baremetal split-DNS zone + advertised subnet route (the former
# per-host ARP resolver / ProxyCommand is retired).

# Wildcard nikopol service-prefix defaults.  Excludes `vzhost.nikopol`
# because that alias targets a different account (`stephane.lacoin`
# on the corp bare metal) — its block is in ssh-tailnet-hosts.nix.
# Without the negation, this `*.nikopol` block would set
# `User nxmatic` for vzhost.nikopol because Include files are read
# before inline matchBlocks and SSH's first-match-wins applies.
Host *.nikopol !vzhost.nikopol
   User nxmatic
   IdentityFile @sshKeysDir@/rdp-host

Host nixos.nikopol
   HostName nikopol-nixos
   
Include ~/.ssh/config.d/zones.d/nikopol.d/*.conf
