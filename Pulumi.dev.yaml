config:
  rke2lab:cluster:
    name: bioskop
  rke2lab:node:
    name: master
  rke2lab:profile:
    name: rke2lab
  rke2lab:incus:
    project: rke2lab
    defaultRemote: bioskop-nixos
    remoteAddress: https://bioskop-nixos:8443
    configDir: /Users/nxmatic/.config/incus
  rke2lab:image:
    alias: control-node
    builderHost: bioskop-nixos
    distrobuilderConfig: classpath:/incus/incus-distrobuilder.yaml
    sharedFolder: .local.d/images/distrobuilder
  rke2lab:network:
    lanBridgeParent: lan-br
    vmnetNetworkName: vmnet-br
  rke2lab:api:
    endpoint: https://10.66.106.10:6443
  rke2lab:worktree:
    dir: /private/var/lib/git/nxmatic/rke2lab
  rke2lab:systemd:
    dbusHost: bioskop-master
    dbusPort: "12434"
  rke2lab:policy:
    debug:
      mesh:
        enabled: "true"
      networking:
        enabled: "true"
      nriPlugins:
        flox:
          enabled: "true"
    network:
      lan:
        binding:
          enabled: "true"
    gitDirtyCheck:
      enabled: "false"
    link:
      gitops: "true"
      networking: "true"
      clusterApi: "true"
      storage: "true"
      mesh: "false"
      highAvailability: "true"
      cicd: "true"
    readiness:
      override:
        systemd-adapter: warning
    # Preview-only fault simulation (ignored during `pulumi up`). Uncomment to order a
    # fake incident and get its runbook from `pulumi preview` without touching infra.
    # Failure-kinds: connection-refused, timeout.
    # preview:
    #   simulate:
    #     systemd-adapter: connection-refused
  rke2lab:readiness:
    enabled: "true"
    timeout: PT1M
  rke2lab:entryGate:
    cleanWorktree:
      required: "false"
  rke2lab:bbox:
    reconcile:
      failOnError: "true"
  rke2lab:hostAsset:
    rotationRetentionCount: "3"
