---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking-kdns
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: cluster-runtime-system-namespace-foundation
  - name: cluster-runtime-system-namespace-workloads
  - name: networking-cilium-config
  force: true
  interval: 5m
  path: ./workloads/networking/kdns
  prune: true
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
