---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cicd-tekton-pipelines-workloads
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  force: true
  healthChecks:
  - apiVersion: operator.tekton.dev/v1alpha1
    kind: TektonConfig
    name: config
  interval: 5m
  path: ./workloads/cicd/tekton-pipelines
  prune: true
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: false
