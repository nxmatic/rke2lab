---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mesh-funnel-state-workloads
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: mesh-tailscale-operators
  - name: mesh-tailscale-workloads
  force: true
  interval: 5m
  path: ./workloads/mesh/funnel-state
  prune: true
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
