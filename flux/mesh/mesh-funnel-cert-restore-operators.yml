---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mesh-funnel-cert-restore-operators
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: mesh-system-namespace-foundation
  - name: mesh-system-namespace-workloads
  - name: storage-openebs-zfs
  force: true
  interval: 5m
  path: ./operators/mesh/funnel-cert-restore
  prune: true
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
