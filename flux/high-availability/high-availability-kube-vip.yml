---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: high-availability-kube-vip
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  force: true
  interval: 5m
  path: ./workloads/high-availability/kube-vip
  prune: true
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
