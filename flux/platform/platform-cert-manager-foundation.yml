---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-cert-manager-foundation
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  force: true
  interval: 5m
  path: ./foundation/platform/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: rke2lab
  wait: true
